<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | The Student Spot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
      text-align: center;
    }

    header {
      background: #d9b8ff;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 45px 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 12px #ddd;
    }

    .card h2 {
      color: #7b4bb7;
    }

    .contact-button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #7b4bb7;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #7b4bb7;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>💌 Contact The Student Spot</h1>
    <p>Have a question? We'd love to hear from you!</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>📚 Need Study Help?</h2>

      <p>
        If you have a question about our study resources,
        notes, or website, you can get in touch.
      </p>

      <p>
        More contact options can be added here later.
      </p>
    </div>

    <a class="back" href="index.html">🏠 Back to Home</a>

  </div>

</body>
</html>
